name: Deploy atlas-connect (hml)

on:
  push:
    branches: [hml]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

env:
  PROJECT_ID: atlas-dw-hml-511718
  REGION: us-central1
  SERVICE_NAME: atlas-connect
  RUNTIME_SERVICE_ACCOUNT: atlas-app-connect@atlas-dw-hml-511718.iam.gserviceaccount.com
  IMAGE: us-central1-docker.pkg.dev/atlas-dw-hml-511718/atlas-ar-apps/atlas-connect
  # O servico sai pela VPC (Direct VPC egress) para alcancar o endpoint PSC do
  # Cloud SQL atlas-pg e o Oracle do IW. Pela atlas-psc-subnet, e nao pela
  # atlas-services-subnet: a VPN classica atlas-iw-tunnel-0 so aceita origem em
  # 10.40.1.0/24 (docs/gcp-setup.md, "Oracle pela VPN").
  VPC_NETWORK: atlas-vpc
  VPC_SUBNET: atlas-psc-subnet
  # Oracle do IW pela VPN (o mesmo banco do Datastream atlas-cp-oracle-iw), em
  # modo thin do python-oracledb. Usuario DS_IW, senha do secret do Datastream.
  ORACLE_HOST: 192.168.30.4
  ORACLE_PORT: "1521"
  ORACLE_SERVICE: IWTST
  ORACLE_SCHEMA: DBIWGERIATRICS
  ORACLE_USER: DS_IW
  # Database atlas-connect na atlas-pg: catalogo do Oracle e o cadastro de
  # AI Providers (lido tambem pelo opalus-atlas-dash-app). Login IAM da SA de
  # runtime, sem senha (DB_IAM_AUTH, src/catalogo.py). O @ do usuario vai como %40.
  POSTGRES_DSN: postgresql://atlas-app-connect%40atlas-dw-hml-511718.iam@atlas-pg.atlas.internal:5432/atlas-connect?sslmode=require

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Docker auth (Artifact Registry)
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build & Push image
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE}:${GITHUB_SHA}"
          docker build --pull --no-cache -t "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      # IA_SENHA_MESTRA vem do secret do GitHub (IA_SENHA_MESTRA) e entra como
      # variavel de ambiente -- a MESMA senha do dash: cifra e decifra as chaves
      # dos provedores de IA. Lista com delimitador "|" (^|^): a senha em base64
      # pode ter "=", "+" e "/".
      # --no-cpu-throttling nos dois ambientes: o lote de descricoes/vetores roda
      # num subprocesso em segundo plano (src/lote.py), fora da requisicao.
      # x-opalus-user-email NUNCA entra aqui: quem identifica o usuario e o LB.
      - name: Deploy Cloud Run
        env:
          IA_SENHA_MESTRA: ${{ secrets.IA_SENHA_MESTRA }}
        run: |
          test -n "${IA_SENHA_MESTRA}" || { echo "secret IA_SENHA_MESTRA vazio no GitHub"; exit 1; }
          set -euo pipefail
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE_TAG}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --no-allow-unauthenticated \
            --no-invoker-iam-check \
            --memory=1Gi \
            --port=8080 \
            --ingress="internal-and-cloud-load-balancing" \
            --concurrency=80 \
            --min-instances=0 \
            --max=1 \
            --timeout=3600s \
            --cpu=1 \
            --no-cpu-throttling \
            --network="${VPC_NETWORK}" \
            --subnet="${VPC_SUBNET}" \
            --vpc-egress=private-ranges-only \
            --set-secrets="ORACLE_PASSWORD=atlas-iw-oracle-ds-iw-password:latest" \
            --set-env-vars="^|^PROJECT_ID=${PROJECT_ID}|ENV=hml|LOG_LEVEL=INFO|DB_IAM_AUTH=true|POSTGRES_DSN=${POSTGRES_DSN}|ORACLE_HOST=${ORACLE_HOST}|ORACLE_PORT=${ORACLE_PORT}|ORACLE_SERVICE=${ORACLE_SERVICE}|ORACLE_SCHEMA=${ORACLE_SCHEMA}|ORACLE_USER=${ORACLE_USER}|IA_SENHA_MESTRA=${IA_SENHA_MESTRA}"

      - name: Print URL
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)'
