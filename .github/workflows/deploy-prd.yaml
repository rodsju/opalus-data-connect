name: Deploy atlas-connect (prd)

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

env:
  PROJECT_ID: atlas-dw-prd-511718
  REGION: southamerica-east1
  SERVICE_NAME: atlas-connect
  RUNTIME_SERVICE_ACCOUNT: atlas-app-connect@atlas-dw-prd-511718.iam.gserviceaccount.com
  IMAGE: southamerica-east1-docker.pkg.dev/atlas-dw-prd-511718/atlas-ar-apps/atlas-connect
  # O servico sai pela VPC (Direct VPC egress) para alcancar o endpoint PSC do
  # Cloud SQL atlas-pg (docs/gcp-setup.md)
  VPC_NETWORK: atlas-vpc
  VPC_SUBNET: atlas-services-subnet
  # SEM Oracle em prd por enquanto: nao ha VPN para o IW no projeto de prd. Quando
  # houver, repetir o que o deploy-hml.yaml faz -- VPC_SUBNET na faixa aceita pelo
  # tunel, ORACLE_* aqui e ORACLE_PASSWORD no --set-secrets.
  # Database atlas-connect na atlas-pg: catalogo do Oracle e o cadastro de
  # AI Providers (lido tambem pelo opalus-atlas-dash-app). Login IAM da SA de
  # runtime, sem senha (DB_IAM_AUTH, src/catalogo.py). O @ do usuario vai como %40.
  POSTGRES_DSN: postgresql://atlas-app-connect%40atlas-dw-prd-511718.iam@atlas-pg.atlas.internal:5432/atlas-connect?sslmode=require

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PRD }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Docker auth (Artifact Registry)
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build & Push image
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE}:${GITHUB_SHA}"
          docker build --pull --no-cache -t "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      # IA_SENHA_MESTRA vem do Secret Manager (ia-senha-mestra), o MESMO secret do
      # dash: cifra e decifra as chaves dos provedores de IA.
      # --no-cpu-throttling nos dois ambientes: o lote de descricoes/vetores roda
      # num subprocesso em segundo plano (src/lote.py), fora da requisicao.
      # x-opalus-user-email NUNCA entra aqui: quem identifica o usuario e o LB.
      - name: Deploy Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE_TAG}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --no-allow-unauthenticated \
            --no-invoker-iam-check \
            --memory=1Gi \
            --port=8080 \
            --ingress="internal-and-cloud-load-balancing" \
            --concurrency=80 \
            --min-instances=0 \
            --max=1 \
            --timeout=3600s \
            --cpu=1 \
            --no-cpu-throttling \
            --network="${VPC_NETWORK}" \
            --subnet="${VPC_SUBNET}" \
            --vpc-egress=private-ranges-only \
            --set-secrets="IA_SENHA_MESTRA=ia-senha-mestra:latest" \
            --set-env-vars="PROJECT_ID=${PROJECT_ID},ENV=prd,LOG_LEVEL=INFO,DB_IAM_AUTH=true,POSTGRES_DSN=${POSTGRES_DSN}"

      - name: Print URL
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)'
