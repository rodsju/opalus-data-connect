<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>

<div style="font-size:19px;color:var(--text-secondary);margin-top:10px;line-height:1.4">Cuidado assistido e centro-dia</div>
