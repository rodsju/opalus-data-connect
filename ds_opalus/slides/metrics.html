<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
.slide{width:1280px;height:720px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--grey-0)}
.pad{padding:72px 88px}
.eyebrow{font-family:var(--font-ui);font-size:17px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h1{font-family:var(--font-display);letter-spacing:-.03em;line-height:1.02;margin:0}
h2{font-family:var(--font-display);letter-spacing:-.02em;line-height:1.06;margin:0}
.lead{font-size:26px;font-weight:300;line-height:1.45}
.mark{position:absolute;left:88px;bottom:52px;height:30px}
.pg{position:absolute;right:88px;bottom:56px;font-family:var(--font-ui);font-size:17px;font-weight:600;letter-spacing:.1em;color:var(--text-tertiary)}
.slide{background:var(--surface-page)}</style></head><body><div class="slide">
<div class="pad" style="flex:1;display:flex;flex-direction:column">
<div class="eyebrow" style="color:var(--teal-500);margin-bottom:16px">Consolidado · 3º trimestre</div>
<h2 style="font-size:48px;font-weight:700;color:var(--navy-700);max-width:840px">O que medimos, publicamos</h2>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:56px">
<div style="padding:32px 28px;border-radius:var(--radius-lg);background:var(--grey-0);border:1px solid var(--border-default);box-shadow:var(--shadow-sm)">
<div class="eyebrow" style="font-size:14px;color:var(--text-secondary)">Ocupação média</div>
<div style="display:flex;align-items:baseline;gap:8px;margin-top:22px"><span style="font-family:var(--font-ui);font-size:64px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;color:var(--navy-700)">92,4</span><span style="font-size:22px;color:var(--text-tertiary)">%</span></div>
<div style="font-family:var(--font-ui);font-size:18px;font-weight:600;color:var(--teal-500);margin-top:16px">▲ +4,2 p.p.</div></div><div style="padding:32px 28px;border-radius:var(--radius-lg);background:var(--grey-0);border:1px solid var(--border-default);box-shadow:var(--shadow-sm)">
<div class="eyebrow" style="font-size:14px;color:var(--text-secondary)">Adesão a protocolos</div>
<div style="display:flex;align-items:baseline;gap:8px;margin-top:22px"><span style="font-family:var(--font-ui);font-size:64px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;color:var(--navy-700)">96,7</span><span style="font-size:22px;color:var(--text-tertiary)">%</span></div>
<div style="font-family:var(--font-ui);font-size:18px;font-weight:600;color:var(--teal-500);margin-top:16px">▲ +2,1 p.p.</div></div><div style="padding:32px 28px;border-radius:var(--radius-lg);background:var(--grey-0);border:1px solid var(--border-default);box-shadow:var(--shadow-sm)">
<div class="eyebrow" style="font-size:14px;color:var(--text-secondary)">Satisfação das famílias</div>
<div style="display:flex;align-items:baseline;gap:8px;margin-top:22px"><span style="font-family:var(--font-ui);font-size:64px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;color:var(--navy-700)">9,2</span><span style="font-size:22px;color:var(--text-tertiary)">/10</span></div>
<div style="font-family:var(--font-ui);font-size:18px;font-weight:600;color:var(--teal-500);margin-top:16px">▲ +0,4</div></div><div style="padding:32px 28px;border-radius:var(--radius-lg);background:var(--gradient-navy);border:1px solid var(--navy-800);box-shadow:var(--shadow-sm)">
<div class="eyebrow" style="font-size:14px;color:rgba(255,255,255,.65)">Leitos ativos</div>
<div style="display:flex;align-items:baseline;gap:8px;margin-top:22px"><span style="font-family:var(--font-ui);font-size:64px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;color:var(--grey-0)">1.284</span><span style="font-size:22px;color:rgba(255,255,255,.6)"></span></div>
<div style="font-family:var(--font-ui);font-size:18px;font-weight:600;color:var(--teal-300);margin-top:16px">▲ +112</div></div>
</div>
<div style="margin-top:auto;font-size:16px;color:var(--text-tertiary)">Fonte: painel de qualidade Opalus, auditoria de setembro de 2026.</div>
</div>
<div class="pg">04</div></div></body></html>
