volumes:
  pg_data:

services:
  app:
    container_name: opalus-data-connect-app
            
    networks:
      - ai_ecosystem
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=hml
      - PROJECT_ID=opalus-datalake-hml-01
      - SA_KEY_FILE=/root/.config/gcloud/application_default_credentials.json
      - x-opalus-user-email=rodrigo.julian@ctrl333.com
      # Usada pelas paginas /oracle, que leem o catalogo gravado por
      # scripts/mapear_oracle.py. De dentro da rede do compose o host e o nome do servico.
      - POSTGRES_DSN=postgresql://catalogo:catalogo@postgres:5432/catalogo

    # As chaves dos provedores de IA (IA_*) vivem no .env, que esta no .gitignore.
    # env_file evita ter que listar aqui cada provedor novo. required:false deixa
    # o projeto subir num clone que ainda nao tem .env.
    env_file:
      - path: .env
        required: false

    build:
      dockerfile: ./Dockerfile.dev

    volumes:
      - .:/app
      - ${HOME}/.config/gcloud/application_default_credentials.json:/root/.config/gcloud/application_default_credentials.json:ro

  # Destino do catalogo gerado por scripts/mapear_oracle.py. Senha trivial de
  # proposito: banco local de exploracao, publicado so em localhost.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: opalus-catalogo-db    
        
    networks:
      - ai_ecosystem
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  ai_ecosystem:
    external: true
