<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Opalus — Site institucional</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--grey-0)}</style></head><body><div id="root"></div>
<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="UnitsPage.jsx"></script>
<script type="text/babel" src="ContactPage.jsx"></script>
<script type="text/babel">
const { TopBar, Button } = window.OpalusDesignSystem_2ac06f;
function App(){
  const [page,setPage]=React.useState("Institucional");
  return (<div>
    <div style={{position:"sticky",top:0,zIndex:40}}>
      <TopBar tone="light" active={page} onNavigate={setPage} assetBase="../../assets"
        links={["Institucional","Unidades","Contato"]}
        action={<Button size="sm" variant="accent" iconAfter="arrow-right" onClick={()=>setPage("Contato")}>Agendar visita</Button>}/>
    </div>
    {page==="Institucional" && <HomePage onOpenUnits={()=>setPage("Unidades")}/>}
    {page==="Unidades" && <UnitsPage/>}
    {page==="Contato" && <ContactPage/>}
    <SiteFooter/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
