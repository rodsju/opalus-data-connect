<!-- @dsCard group="Colors" viewport="700x200" name="Vivid (relatórios)" subtitle="Paleta saturada para dados: gráficos, KPIs e o hero de /reports." -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-body)}.row{display:flex;gap:10px}.sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-muted)}.sw b{display:block;height:56px}.sw i{display:block;height:18px}.sw span{display:block;font-family:var(--font-mono);font-size:var(--text-3xs);color:var(--text-secondary);padding:6px}.hero{margin-top:14px;height:40px;border-radius:var(--radius-md);background:var(--gradient-report)}</style></head><body>
<div class="row">
<div class="sw"><b style="background:var(--vivid-blue)"></b><i style="background:var(--vivid-blue-soft)"></i><span>blue</span></div>
<div class="sw"><b style="background:var(--vivid-teal)"></b><i style="background:var(--vivid-teal-soft)"></i><span>teal</span></div>
<div class="sw"><b style="background:var(--vivid-violet)"></b><i style="background:var(--vivid-violet-soft)"></i><span>violet</span></div>
<div class="sw"><b style="background:var(--vivid-amber)"></b><i style="background:var(--vivid-amber-soft)"></i><span>amber</span></div>
<div class="sw"><b style="background:var(--vivid-coral)"></b><i style="background:var(--vivid-coral-soft)"></i><span>coral</span></div>
<div class="sw"><b style="background:var(--vivid-cyan)"></b><i style="background:var(--vivid-cyan-soft)"></i><span>cyan</span></div>
<div class="sw"><b style="background:var(--vivid-magenta)"></b><i style="background:var(--vivid-magenta-soft)"></i><span>magenta</span></div>
<div class="sw"><b style="background:var(--vivid-green)"></b><i style="background:var(--vivid-green-soft)"></i><span>green</span></div>
</div>
<div class="hero"></div>
</body></html>
