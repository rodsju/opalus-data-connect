name: Deploy vert-datalake-demo-app (hml)

on:
  push:
    branches: [hml]
    paths-ignore: ["README.md"]
  workflow_dispatch:

env:
  PROJECT_ID: vert-datalake-hml-01
  REGION: us-east1
  SERVICE_NAME: vert-datalake-demo-app
  RUNTIME_SERVICE_ACCOUNT: sa-cr-bq-reader@vert-datalake-hml-01.iam.gserviceaccount.com
  IMAGE: us-east1-docker.pkg.dev/vert-datalake-hml-01/ar-datalake/vert-datalake-demo-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Docker auth (Artifact Registry)
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build & Push image
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE}:${GITHUB_SHA}"
          docker build -t "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Deploy Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE_TAG}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --memory=512Mi \
            --port=8080 \
            --ingress="internal-and-cloud-load-balancing" \
            --concurrency=200 \
            --min-instances=0 \
            --max=1 \
            --timeout=3600s \
            --cpu=1 \
            --no-cpu-throttling \
            --set-env-vars="PROJECT_ID=${PROJECT_ID},ENV=hml,LOG_LEVEL=INFO"

      - name: Print URL
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)'
